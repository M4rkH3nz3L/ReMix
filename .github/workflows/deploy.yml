name: Deploy (Hetzner)

# A ReMix-backend éles deployja: SSH-val a szerverre, git pull + docker compose
# újraépítés a server/ stackből (api + worker + redis + caddy). A hiteles HOGYAN:
# server/DEPLOY.md. A compose context a `server/` almappa, ezért a build is ott fut.
#
# ⚠️ ELŐFELTÉTEL (egyszeri, kézi first-run — a workflow NEM végzi el):
#   1) a szerver fel van húzva (ops/server-setup.sh lefutott, deploy user + docker),
#   2) (opcionális) a repo klónozva: /var/www/app — ha nincs, az első futás klónozza,
#   3) az env: vagy az ENV_PRODUCTION + RENDER_DOMAIN secretek, vagy kézzel
#      /var/www/app/server/.env.production + /var/www/app/server/.env (RENDER_DOMAIN=...).
# Ezek után minden main-push ezzel a workflow-val automatikusan újradeployol.
#
# GitHub secretek (Settings → Secrets and variables → Actions):
#   SSH_HOST         = 195.201.16.57
#   SSH_USER         = deploy
#   SSH_KEY          = a ~/.ssh/remix_deploy TELJES tartalma (BEGIN…END sorokkal)
#   SSH_PASSWORD     = VAGY a szerver-user jelszava (ha nincs kulcs — a kulcs ajánlott)
#   SSH_KNOWN_HOSTS  = `ssh-keyscan 195.201.16.57` kimenete  (opcionális, lásd lent)
#   ENV_PRODUCTION   = a TELJES server/.env.production tartalma (opcionális — ha megvan,
#                      a deploy írja ki a szerverre; enélkül kézzel kell elhelyezni)
#   RENDER_DOMAIN    = a backend domainje (pl. api.pelda.hu) — a DNS A-rekordja
#                      a szerver IP-jére mutasson (a Caddy ebből kér HTTPS-t)
#
# Első futáskor a workflow MAGA klónozza a repót /var/www/app-ba (ha még nincs),
# és mindig a MAIN ágat futtatja (fast-forward).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy a szerverre
    runs-on: ubuntu-latest
    environment: production
    steps:
      # 🩺 Előellenőrzés: melyik secret van meg (az ÉRTÉKEK NÉLKÜL) — a hiányzó/hibás
      # beállítás NYILVÁNOS annotációként jelenik meg a futás összegzésében, így a
      # hiba oka a log megnyitása nélkül is látszik.
      - name: Secretek ellenőrzése
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          RENDER_DOMAIN: ${{ secrets.RENDER_DOMAIN }}
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
          # a gyakori félrekattintás felismerése: Variables fülre került Secrets helyett
          V_SSH_HOST: ${{ vars.SSH_HOST }}
          V_SSH_USER: ${{ vars.SSH_USER }}
          V_SSH_KEY: ${{ vars.SSH_KEY }}
          V_SSH_PASSWORD: ${{ vars.SSH_PASSWORD }}
          V_RENDER_DOMAIN: ${{ vars.RENDER_DOMAIN }}
          V_ENV_PRODUCTION: ${{ vars.ENV_PRODUCTION }}
        run: |
          fail=0
          for n in SSH_HOST SSH_USER SSH_KEY SSH_PASSWORD RENDER_DOMAIN ENV_PRODUCTION; do
            v="V_$n"
            if [ -n "${!v:-}" ]; then
              echo "::warning title=$n a VARIABLES fülön van::Settings → Secrets and variables → Actions → a „Secrets” fülre kell (a Variables-t a titkokhoz nem használjuk)"
            fi
          done
          # a NEM titkos host/user a Variables-ből is elfogadható
          SSH_HOST="${SSH_HOST:-${V_SSH_HOST:-}}"
          SSH_USER="${SSH_USER:-${V_SSH_USER:-}}"
          RENDER_DOMAIN="${RENDER_DOMAIN:-${V_RENDER_DOMAIN:-}}"
          [ -n "${SSH_HOST:-}" ] || { echo "::error title=Hiányzó secret::SSH_HOST (a szerver IP-je, pl. 195.201.16.57)"; fail=1; }
          [ -n "${SSH_USER:-}" ] || { echo "::error title=Hiányzó secret::SSH_USER (pl. deploy vagy root)"; fail=1; }
          if [ -n "${SSH_KEY:-}" ]; then
            if printf '%s' "$SSH_KEY" | grep -q -- '-----BEGIN'; then
              echo "::notice title=SSH-belépés::kulccsal (SSH_KEY)"
            else
              echo "::error title=Hibás SSH_KEY::a TELJES privát kulcs kell, a -----BEGIN … -----END sorokkal együtt"; fail=1
            fi
          elif [ -n "${SSH_PASSWORD:-}" ]; then
            echo "::notice title=SSH-belépés::jelszóval (SSH_PASSWORD)"
          else
            echo "::error title=Hiányzó secret::SSH_KEY vagy SSH_PASSWORD (a szerver-belépéshez)"; fail=1
          fi
          [ -n "${RENDER_DOMAIN:-}" ] && echo "::notice title=RENDER_DOMAIN::megadva" || echo "::warning title=Nincs RENDER_DOMAIN secret::a szerveren kézzel elhelyezett server/.env kell (RENDER_DOMAIN=...)"
          [ -n "${ENV_PRODUCTION:-}" ] && echo "::notice title=ENV_PRODUCTION::megadva" || echo "::warning title=Nincs ENV_PRODUCTION secret::a szerveren kézzel elhelyezett server/.env.production kell"
          exit $fail

      # 🔑 Az env-fájl a GitHub secretből (opcionális): a TELJES server/.env.production
      # tartalma az ENV_PRODUCTION secretben. Base64-ben megy át (a több soros érték
      # így sértetlen marad), és maszkolva van a logban.
      - name: Env előkészítése (ha az ENV_PRODUCTION secret meg van adva)
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        run: |
          if [ -n "${ENV_PRODUCTION:-}" ]; then
            b64=$(printf '%s' "$ENV_PRODUCTION" | base64 -w0)
            echo "::add-mask::$b64"
            echo "ENV_B64=$b64" >> "$GITHUB_ENV"
            echo "ENV_PRODUCTION secret: megvan → a szerveren felülírja a server/.env.production-t"
          else
            echo "ENV_PRODUCTION secret: nincs → a szerveren kézzel elhelyezett server/.env.production kell"
          fi

      - name: Deploy — (első futáskor klón) + main + docker compose up --build
        uses: appleboy/ssh-action@v1.2.0
        env:
          RENDER_DOMAIN: ${{ secrets.RENDER_DOMAIN || vars.RENDER_DOMAIN }}
          GIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          username: ${{ secrets.SSH_USER || vars.SSH_USER }}
          port: 22
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          # Host-kulcs ellenőrzés: ha beállítod az SSH_KNOWN_HOSTS secretet
          # (`ssh-keyscan 195.201.16.57`), a MITM-védelemhez add meg itt a
          # szerver ujjlenyomatát is: fingerprint: <sha256:...>. Enélkül az
          # appleboy/ssh-action a futás elején fogadja a host-kulcsot.
          command_timeout: 30m
          envs: ENV_B64,RENDER_DOMAIN,GIT_SHA
          script: |
            set -euo pipefail
            APP=/var/www/app
            # 🧰 első futás: a repo klónozása, ha még nincs a szerveren
            if [ ! -d "$APP/.git" ]; then
              echo "==> első futás: klónozás ide: $APP"
              sudo install -d -o "$(id -un)" -g "$(id -gn)" "$APP"
              if [ -n "$(ls -A "$APP" 2>/dev/null)" ]; then
                echo "HIBA: a $APP nem üres és nem git-repo — nézd meg kézzel"; exit 1
              fi
              git clone https://github.com/M4rkH3nz3L/ReMix.git "$APP"
            fi
            cd "$APP"
            # 🌿 a szerver MINDIG a main ágat futtatja (fast-forward — helyi változást nem dob el)
            git fetch --prune origin main
            git checkout -q main 2>/dev/null || git checkout -q -b main origin/main
            git merge --ff-only origin/main
            echo "==> main @ $(git rev-parse --short HEAD)"
            cd server
            # 🔑 env-fájlok a secretekből (ha meg vannak adva), különben a kézzel elhelyezettek
            if [ -n "${ENV_B64:-}" ]; then
              umask 077
              printf '%s' "$ENV_B64" | base64 -d > .env.production
            fi
            if [ -n "${RENDER_DOMAIN:-}" ]; then
              printf 'RENDER_DOMAIN=%s\n' "$RENDER_DOMAIN" > .env
            fi
            test -f .env.production || { echo "HIBA: hiányzik a server/.env.production — add meg az ENV_PRODUCTION secretet (a teljes fájl tartalma), vagy helyezd el kézzel"; exit 1; }
            test -f .env || { echo "HIBA: hiányzik a RENDER_DOMAIN — add meg a RENDER_DOMAIN secretet (pl. api.pelda.hu)"; exit 1; }
            # a futó commit a /health-ben is látszik (kívülről ellenőrizhető, mi fut)
            export GIT_SHA="${GIT_SHA:-$(git rev-parse HEAD)}"
            docker compose up -d --build --remove-orphans
            docker image prune -f
            docker compose ps

      - name: Health-ellenőrzés
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          username: ${{ secrets.SSH_USER || vars.SSH_USER }}
          port: 22
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            # a konténer belső health-je (a Caddy mögött); a domain-health kívülről mehet
            for i in $(seq 1 10); do
              if docker compose -f /var/www/app/server/docker-compose.yml exec -T api \
                   node -e "require('http').get('http://127.0.0.1:8787/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"; then
                echo "API health OK"; exit 0
              fi
              echo "várakozás az API-ra ($i/10)…"; sleep 6
            done
            echo "HIBA: az API nem lett healthy"
            docker compose -f /var/www/app/server/docker-compose.yml logs --tail=80 api || true
            exit 1
